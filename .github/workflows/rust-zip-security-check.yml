name: Rust ZIP security preparation
on:
  push:
    branches: [codex/rust-zip-security]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve fixed ZIP and test the Rust runtime
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          export RUSTUP_TOOLCHAIN=1.90.0
          cargo update --manifest-path app/src/main/rust/Cargo.toml -p zip --precise 9.1.3
          cargo tree --manifest-path app/src/main/rust/Cargo.toml -i zip
          cargo test --locked --jobs 4 --lib --manifest-path app/src/main/rust/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-zip-security-lock
          path: app/src/main/rust/Cargo.lock

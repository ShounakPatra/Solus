name: Publish Solus F-Droid repository

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag containing app-release.apk and its checksum
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: solus-fdroid-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install F-Droid tools
        run: |
          python -m pip install 'fdroidserver==2.4.5'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Fetch and verify the published APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/fdroid/repo" "$RUNNER_TEMP/fdroid/metadata"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'app-release.apk' --pattern 'app-release.apk.sha256' --dir "$RUNNER_TEMP/download"
          cd "$RUNNER_TEMP/download"
          sha256sum --check app-release.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app-release.apk > "$RUNNER_TEMP/apk-certificate.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: a188e072ab29759eaa1346a1a7056f1854c92d78ecb2a310ae560b8e5cb0ffc3' "$RUNNER_TEMP/apk-certificate.txt"
          cp app-release.apk "$RUNNER_TEMP/fdroid/repo/"
          cp "$GITHUB_WORKSPACE/fdroid/metadata/com.shounak.localmeshai.yml" "$RUNNER_TEMP/fdroid/metadata/"
      - name: Generate signed repository index
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
          FDROID_REPO_KEY_PASSWORD: ${{ secrets.FDROID_REPO_KEY_PASSWORD }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/fdroid"
          python "$GITHUB_WORKSPACE/fdroid/write_config.py"
          fdroid update
          mkdir -p "$RUNNER_TEMP/pages/fdroid"
          cp -a repo "$RUNNER_TEMP/pages/fdroid/"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

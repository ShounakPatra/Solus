name: Attach APK to release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v6.0.5)
        required: true
        type: string
      run_id:
        description: Successful Android CI run containing the APK
        required: true
        type: string
      kind:
        description: APK to attach
        required: true
        default: signed-release
        type: choice
        options:
          - signed-release
          - debug

permissions:
  contents: read

concurrency:
  group: release-asset-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    # Signing keys must only reach a run a maintainer approved. Configure the "release"
    # environment with required reviewers and a main-only deployment branch rule, and store
    # the ANDROID_* signing secrets as environment secrets (not repository secrets).
    environment:
      name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      APK_KIND: ${{ inputs.kind }}
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate source run and destination release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v?[0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid release tag'; exit 1; }
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json status,conclusion,event,headBranch,workflowName,headSha > "$RUNNER_TEMP/source-run.json"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha' > "$RUNNER_TEMP/release-tag-sha.txt"
          python3 tools/validate_release_source.py --run-json "$RUNNER_TEMP/source-run.json" --tag-sha-file "$RUNNER_TEMP/release-tag-sha.txt"

      - name: Download existing CI artifact on the runner
        shell: bash
        run: |
          set -euo pipefail
          case "$APK_KIND" in
            debug) artifact=solus-debug-apk ;;
            signed-release) artifact=solus-release-apk ;;
            *) echo 'Unsupported APK kind'; exit 1 ;;
          esac
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" --dir downloaded-apk

      - name: Install Android signing tools
        if: inputs.kind == 'signed-release'
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'

      - name: Prepare debug APK
        if: inputs.kind == 'debug'
        run: python3 tools/prepare_release_apk.py --artifact-dir downloaded-apk --output-dir prepared-apk --kind debug --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID"

      - name: Sign release APK and verify certificate
        if: inputs.kind == 'signed-release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 tools/prepare_release_apk.py --artifact-dir downloaded-apk --output-dir prepared-apk --kind signed-release --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID" --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: Attach APK and checksum to existing release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" prepared-apk/*.apk prepared-apk/*.sha256 \
            --repo "$GITHUB_REPOSITORY"

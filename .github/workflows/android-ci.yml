name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Test packaging and SDK installation tools
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      - name: Provision pinned NDK, CMake, and host shader tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libvulkan-dev
          ANDROID_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "${ANDROID_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          export PATH="${ANDROID_ROOT}/cmdline-tools/latest/bin:${PATH}"
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager 2>/dev/null || echo sdkmanager)"
          fi
          bash tools/install-android-sdk.sh "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Run host C++ native tests
        run: |
          cmake -S app/src/test/cpp -B build/host-native-tests
          cmake --build build/host-native-tests --config Release --parallel 4
          ctest --test-dir build/host-native-tests -C Release --output-on-failure

      - name: Prepare and test Candle runtime
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target aarch64-linux-android
          cargo test --locked --jobs 4 --lib --manifest-path app/src/main/rust/Cargo.toml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Compile instrumentation tests (device-free verification)
        run: ./gradlew assembleDebugAndroidTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify release APK size and structure
        run: |
          RELEASE_APK=$(python3 -c "import json; data=json.load(open('app/build/outputs/apk/release/output-metadata.json')); print('app/build/outputs/apk/release/' + data['elements'][0]['outputFile'])")
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV
          echo "Resolved release APK: $RELEASE_APK"
          mkdir -p build/reports/apk-size
          # Portable inference adds arm64 ONNX, TFLite and Candle libraries to
          # the former 39,849,556-byte baseline. Retain a bounded size gate;
          # refresh the signed baseline after device validation of these runtimes.
          python3 tools/apk_size_report.py \
            --apk "$RELEASE_APK" \
            --output build/reports/apk-size/release-size-report.json \
            --max-apk-bytes 64000000 \
            --verify-optimized

      - name: Upload release APK (unsigned CI build)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solus-release-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solus-apk-size-report
          path: build/reports/apk-size/release-size-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload R8 mapping
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solus-release-r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native debug symbols
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solus-release-native-symbols
          path: app/build/outputs/native-debug-symbols/release/
          if-no-files-found: warn
          retention-days: 14

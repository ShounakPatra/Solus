name: F-Droid source build candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/cpp/CMakeLists.txt'
      - 'tools/build-candle.sh'
      - 'tools/fdroid*'
      - 'fdroid/official/**'
      - '.github/workflows/fdroid-official-check.yml'
permissions:
  contents: read
concurrency:
  group: fdroid-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fast F-Droid source preflight
        run: python3 tools/fdroid_preflight.py --verify-gradle
      - name: Install pinned F-Droid tooling
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install \
            'git+https://gitlab.com/fdroid/fdroidserver.git@cdfdce835a8231996b02392bc79c1879e6bef501' \
            'git+https://gitlab.com/fdroid/gradlew-fdroid.git@ac23ffb5285c0c0961a677e310dd58ef90531057'
          echo "$RUNNER_TEMP/fdroid-venv/bin" >> "$GITHUB_PATH"
      - name: Rehearse recipe system prerequisites
        run: |
          set -euo pipefail
          # fdroid --test skips sudo. Execute that exact recipe block here;
          # an official --server build executes it inside its disposable VM.
          python - <<'PY'
          import pathlib, subprocess, yaml
          recipe = yaml.safe_load(pathlib.Path('fdroid/official/com.shounak.localmeshai.yml').read_text())
          subprocess.run(['sudo', 'env', 'DEBIAN_FRONTEND=noninteractive', 'bash', '-euo', 'pipefail', '-c',
                          '\n'.join(recipe['Builds'][0]['sudo'])], check=True)
          PY
          # fdroid --server installs the recipe's NDK automatically. The local
          # rehearsal must supply it before fdroid validates ndk_path().
          sdkmanager --sdk_root="$ANDROID_HOME" 'ndk;28.2.13676358'
          echo 'JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' >> "$GITHUB_ENV"
      - name: Verify Gradle support and launcher before building
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request
          props = dict(line.split('=', 1) for line in pathlib.Path('gradle/wrapper/gradle-wrapper.properties').read_text().splitlines() if '=' in line)
          url = props['distributionUrl'].replace('\\:', ':')
          catalog = json.load(urllib.request.urlopen('https://gitlab.com/fdroid/gradle-transparency-log/-/raw/master/checksums.json'))
          assert any(entry.get('sha256') == props['distributionSha256Sum'] for entry in catalog.get(url, [])), 'Gradle absent from F-Droid catalog or checksum differs'
          print('Confirmed F-Droid checksum support:', url)
          PY
          fdroid build --help
          gradlew-fdroid --version
      - name: Build recipe with scanning enabled
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fdroid-data/metadata" "$RUNNER_TEMP/fdroid-data/build" "$RUNNER_TEMP/fdroid-data/srclibs" "$RUNNER_TEMP/fdroid-data/config"
          cp fdroid/official/com.shounak.localmeshai.yml "$RUNNER_TEMP/fdroid-data/metadata/"
          cp fdroid/official/srclibs/rustup.yml "$RUNNER_TEMP/fdroid-data/srclibs/"
          curl --fail --location --retry 3 \
            'https://gitlab.com/fdroid/fdroiddata/-/raw/131e1a725ef2bd54ec45a19e281d561908c82cdc/config/categories.yml' \
            -o "$RUNNER_TEMP/fdroid-data/config/categories.yml"
          cd "$RUNNER_TEMP/fdroid-data"
          python - <<'PY'
          import os, pathlib, yaml
          path = pathlib.Path('metadata/com.shounak.localmeshai.yml')
          recipe = yaml.safe_load(path.read_text())
          recipe['Builds'][0]['commit'] = os.environ['GITHUB_SHA']
          path.write_text(yaml.safe_dump(recipe, sort_keys=False))
          # Category icons are publishing assets, unused by this build/lint
          # rehearsal. Keep the official category definitions without asking
          # fdroid lint to copy icon files from the rest of fdroiddata.
          path = pathlib.Path('config/categories.yml')
          categories = yaml.safe_load(path.read_text())
          for category in categories.values():
              category.pop('icon', None)
          path.write_text(yaml.safe_dump(categories, sort_keys=False))
          PY
          printf 'sdk_path: "%s"\ngradle: "%s"\nscan_binary: true\n' "$ANDROID_HOME" "$(command -v gradlew-fdroid)" > config.yml
          git clone https://github.com/ShounakPatra/Solus.git build/com.shounak.localmeshai
          git -C build/com.shounak.localmeshai checkout "$GITHUB_SHA"
          fdroid rewritemeta com.shounak.localmeshai
          fdroid readmeta
          fdroid lint com.shounak.localmeshai
          fdroid build --verbose --test --latest com.shounak.localmeshai 2>&1 | tee fdroid-build.log
          if grep -Eq '([1-9][0-9]* build failed|ERROR:)' fdroid-build.log; then exit 1; fi
          test -s tmp/com.shounak.localmeshai_12.apk
          sha256sum tmp/com.shounak.localmeshai_12.apk > tmp/apk.sha256
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions tmp/com.shounak.localmeshai_12.apk > tmp/permissions.txt
          if grep -q REQUEST_INSTALL_PACKAGES tmp/permissions.txt; then
            echo 'F-Droid APK must not request APK installation permission.' >&2
            exit 1
          fi
      - name: Record release dependency licenses
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fdroid-data/build/com.shounak.localmeshai"
          gradlew-fdroid --no-configuration-cache -PsolusFdroid=true testDebugUnitTest --tests '*FdroidDistributionTest'
          gradlew-fdroid --no-configuration-cache -I tools/fdroid-dependencies.init.gradle :app:fdroidDependencyInventory
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo +1.90.0 metadata --locked --filter-platform aarch64-linux-android --format-version 1 --manifest-path app/src/main/rust/Cargo.toml > build/reports/fdroid/cargo-metadata.json
          python tools/fdroid_dependency_audit.py --cargo-metadata build/reports/fdroid/cargo-metadata.json
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fdroid-source-build-evidence
          path: |
            ${{ runner.temp }}/fdroid-data/fdroid-build.log
            ${{ runner.temp }}/fdroid-data/metadata/com.shounak.localmeshai.yml
            ${{ runner.temp }}/fdroid-data/logs
            ${{ runner.temp }}/fdroid-data/tmp/*.apk
            ${{ runner.temp }}/fdroid-data/tmp/apk.sha256
            ${{ runner.temp }}/fdroid-data/tmp/permissions.txt
            ${{ runner.temp }}/fdroid-data/build/com.shounak.localmeshai/build/reports/fdroid
          if-no-files-found: warn
          retention-days: 14

# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# High-performance JVM args for Gradle daemon (4GB heap, ParallelGC, 1GB metaspace)
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.java.installations.auto-detect=false

# Kotlin code style for this project
kotlin.code.style=official

# AndroidX support & SDK configuration
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36,36.1,37,37.0

# Build performance optimizations
org.gradle.configuration-cache=true
org.gradle.warning.mode=all
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true

# Kotlin build performance optimizations
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC

# Android resource & build speed optimizations
android.nonTransitiveRClass=true
android.enableResourceOptimizations=true

# Suppress external native build configuration & experimental option warnings
android.sync.suppressAgpWarnings=EXTERNAL_NATIVE_BUILD_CONFIGURATION,UNSUPPORTED_PROJECT_OPTION_USE
